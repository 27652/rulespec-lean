name: RuleSpecLean
on: [push, pull_request, workflow_dispatch]

jobs:
  python-and-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - run: bash scripts/verify.sh offline

  upstream-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/axiom-rules-engine
          ref: a4322e45a035ba9fd412d01bebe078aeaa46cd54
          path: upstream-engine
      - uses: actions/checkout@v4
        with:
          repository: TheAxiomFoundation/rulespec-us
          ref: d8a4c9cb560ed55c6db47ea36214249f67319461
          path: rulespec-us
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - run: python -m pip install -r experiments/requirements.txt
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo +1.98.1 build --locked --bin axiom-rules-engine
        working-directory: upstream-engine
      - run: cargo +1.98.1 build --locked --manifest-path experiments/decimal_oracle/Cargo.toml
      - name: Reproduce upstream experiments
        env:
          ENGINE: upstream-engine/target/debug/axiom-rules-engine
          ENGINE_SOURCE: upstream-engine
          CORPUS: rulespec-us
          ORACLE: experiments/decimal_oracle/target/debug/rulespec-decimal-oracle
        run: RUSTC="$(rustup which --toolchain 1.98.1 rustc)" bash scripts/verify.sh upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-integration
          path: .verification/upstream/
          include-hidden-files: true
